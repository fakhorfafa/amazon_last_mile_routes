<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Last Mile Routes</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script src="data.js"></script>
<style>
/* Layout: icon rail + full-bleed map stage with floating glass panels (overview); scrolling views for analysis and routes. */
:root {
  color-scheme: light;
  --frame: #eef1f5; --rail: #ffffff; --bg: #f7f9fb; --surface-1: #fcfcfb; --border: #e3e4e8;
  --text-primary: #101114; --text-secondary: #545861; --text-muted: #8a8e97;
  --grid: #eceef1;
  --sea: #d6e2ee; --land: #ffffff; --land-line: #b9c8d8;
  --wash: rgba(250, 252, 254, .96); --glass: rgba(255, 255, 255, .8); --glass-line: rgba(255, 255, 255, 1); --shadow: 0 10px 30px rgba(40, 60, 90, .12);
  --s-high: #2a78d6; --s-medium: #eb6834; --s-low: #1baf7a;
  --good: #16c06a; --warn: #f2c200; --bad: #ef3d5a;
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --frame: #0c0d10; --rail: #15171b; --bg: #111214; --surface-1: #1a1b1e; --border: #2b2d33;
  --text-primary: #f0f1f3; --text-secondary: #b9bcc4; --text-muted: #8a8e97;
  --grid: #26282d;
  --sea: #1b2532; --land: #2e3a49; --land-line: #44546a;
  --wash: rgba(17, 19, 23, .92); --glass: rgba(24, 27, 33, .74); --glass-line: rgba(255, 255, 255, .08); --shadow: 0 10px 30px rgba(0, 0, 0, .45);
  --s-high: #3987e5; --s-medium: #d95926; --s-low: #199e70;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--frame); color: var(--text-primary);
  font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
.app { display: flex; height: 100%; padding: 12px; gap: 0; }
.shell { flex: 1; display: flex; min-width: 0; border-radius: 18px; overflow: hidden; box-shadow: var(--shadow); background: var(--bg); }

/* Icon rail */
.rail { width: 60px; flex: none; background: var(--rail); border-right: 1px solid var(--border);
  display: flex; flex-direction: column; align-items: center; padding: 18px 0; gap: 8px; }
.logo { width: 30px; height: 30px; margin-bottom: 22px; }
.rail button { width: 38px; height: 38px; border: 0; border-radius: 10px; background: transparent; color: var(--text-secondary);
  display: grid; place-items: center; cursor: pointer; }
.rail button:hover { background: var(--grid); }
.rail button[aria-current="page"] { background: var(--grid); color: var(--text-primary); }
.rail button:focus-visible, .chip:focus-visible, .city-row:focus-visible { outline: 2px solid var(--s-high); outline-offset: 2px; }
.rail .spacer { flex: 1; }
.rail svg { width: 19px; height: 19px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

.stage { flex: 1; position: relative; min-width: 0; overflow: hidden; }
.view { position: absolute; inset: 0; }
.view[hidden] { display: none !important; }

/* Overview: map + glass */
#ov { background: var(--sea); }
#usmap { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
#ov::before { content: ""; position: absolute; inset: 0; z-index: 1; pointer-events: none;
  background: linear-gradient(90deg, var(--wash) 0, var(--wash) 18%, transparent 42%); }
#usmap path.state { fill: var(--land); stroke: var(--land-line); stroke-width: .8; }
.glow { pointer-events: none; }
.dot { cursor: pointer; stroke: #fff; stroke-width: 2; }
.dot.dim, .glow.dim { opacity: .18; }
.maptip { position: absolute; pointer-events: none; background: var(--glass); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  border: 1px solid var(--glass-line); border-radius: 10px; box-shadow: var(--shadow); padding: 8px 10px; font-size: 12px; white-space: nowrap; z-index: 5; }
.maptip b { display: block; font-size: 13px; }
.maptip span { color: var(--text-secondary); }

.hello { position: absolute; top: 34px; left: 40px; width: min(330px, calc(100% - 80px)); z-index: 2; }
.hello h1 { font-size: 30px; font-weight: 500; letter-spacing: -0.02em; margin: 0 0 4px; }
.hello .sub { color: var(--text-primary); opacity: .75; font-size: 12.5px; margin: 0 0 18px; }
.tabs { display: flex; gap: 14px; font-size: 13px; margin-bottom: 12px; }
.tabs .on { font-weight: 650; }
.tabs .off { color: var(--text-muted); }
.city-row { display: grid; grid-template-columns: 82px 1fr 40px; gap: 8px; align-items: center; font-size: 11.5px; padding: 3px 4px; margin: 0 -4px;
  border: 0; background: transparent; color: inherit; font: inherit; font-size: 11.5px; text-align: left; width: calc(100% + 8px); border-radius: 6px; cursor: pointer; }
.city-row:hover { background: var(--glass); }
.city-row[aria-pressed="true"] { background: var(--glass); box-shadow: inset 0 0 0 1px var(--glass-line); }
.city-row .bar { display: flex; height: 5px; border-radius: 3px; overflow: hidden; background: rgba(0,0,0,.08); gap: 2px; }
.city-row .bar i { display: block; height: 100%; border-radius: 3px; }
.city-row .v { text-align: right; font-variant-numeric: tabular-nums; }
.group-label { font-size: 9.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--text-muted); margin: 10px 0 2px; }
.legend-mini { display: flex; gap: 10px; flex-wrap: wrap; font-size: 10.5px; color: var(--text-secondary); margin-top: 10px; }
.legend-mini i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 4px; vertical-align: 0; }

.topbar { position: absolute; top: 18px; right: 18px; display: flex; gap: 8px; z-index: 3; }
.chip { display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 10px; border-radius: 7px; border: 1px solid var(--glass-line);
  background: var(--glass); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); color: var(--text-primary);
  font: inherit; font-size: 13px; cursor: pointer; box-shadow: 0 2px 8px rgba(0,0,0,.08); }
.chip svg { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.chip.lang { padding: 0; overflow: hidden; gap: 0; }
.chip.lang button { height: 100%; border: 0; background: transparent; color: var(--text-secondary); font: inherit; font-size: 12px; font-weight: 650; padding: 0 10px; cursor: pointer; }
.chip.lang button[aria-pressed="true"] { background: var(--text-primary); color: var(--surface-1); }
.chip.theme button { display: inline-flex; align-items: center; gap: 5px; }
.chip.theme svg { width: 14px; height: 14px; }

.cards { position: absolute; left: 34px; right: 34px; bottom: 30px; display: grid; gap: 22px;
  grid-template-columns: repeat(3, minmax(0, 270px)); z-index: 2; }
.gcard { background: var(--glass); backdrop-filter: blur(18px) saturate(1.2); -webkit-backdrop-filter: blur(18px) saturate(1.2);
  border: 1px solid var(--glass-line); border-radius: 16px; box-shadow: var(--shadow); padding: 14px 16px 16px; min-width: 0;
  display: flex; flex-direction: column; gap: 10px; }
.gcard header { display: flex; align-items: baseline; gap: 4px 8px; flex-wrap: wrap; }
.gcard h3, .gcard header a, .gcard header .tag { white-space: nowrap; }
.gcard h3 { font-size: 13px; font-weight: 650; margin: 0; }
.gcard header a { font-size: 12px; color: var(--s-high); text-decoration: none; cursor: pointer; }
.gcard header .tag { margin-left: auto; font-size: 10.5px; color: var(--text-muted); }
.gcard p { margin: 0; font-size: 12px; color: var(--text-secondary); line-height: 1.45; }
.pillars { display: flex; justify-content: space-around; align-items: flex-end; height: 104px; }
.pillar { display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 11px; color: var(--text-secondary); }
.pillar .pair { display: flex; gap: 4px; align-items: flex-end; height: 76px; }
.pillar .pair i { width: 7px; border-radius: 4px; display: block; }
.pillar .pair i.hatch { opacity: .85; }
.pillar b { font-size: 11.5px; color: var(--text-primary); font-variant-numeric: tabular-nums; font-weight: 600; }
.ring { display: grid; place-items: center; height: 104px; }
.ring svg { width: 104px; height: 104px; }
.ring text { font-variant-numeric: tabular-nums; }
.tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; height: 104px; }
.tile { border-radius: 12px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-align: center;
  box-shadow: 0 6px 16px rgba(0,0,0,.12); padding: 6px; }
.tile svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.tile small { font-size: 11px; line-height: 1.2; }
.tile b { font-size: 19px; font-weight: 650; font-variant-numeric: tabular-nums; line-height: 1.1; }
.tile.t1 { background: #4a9bf5; color: #fff; }
.tile.t2 { background: #34e08a; color: #0d3a22; }
.tile.t3 { background: var(--surface-1); color: var(--text-primary); }

/* Analysis + routes views */
.scrollview { overflow-y: auto; padding: 28px 28px 48px; }
.scrollview h1 { font-size: 24px; margin: 0 0 4px; letter-spacing: -0.01em; text-wrap: balance; }
h2 { font-size: 16px; margin: 0 0 4px; }
.sub, .note { color: var(--text-secondary); }
.note { font-size: 12.5px; margin: 0 0 12px; }
.grid { display: grid; gap: 16px; margin-top: 16px; }
.kpis { grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); }
.two { grid-template-columns: repeat(auto-fit, minmax(min(100%, 340px), 1fr)); }
.card { background: var(--surface-1); border: 1px solid var(--border); border-radius: 12px; padding: 16px; min-width: 0; }
.kpi .v { font-size: 24px; font-weight: 650; font-variant-numeric: tabular-nums; }
.kpi .l { color: var(--text-secondary); font-size: 12.5px; }
.chart { position: relative; height: 260px; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12.5px; color: var(--text-secondary); margin-bottom: 8px; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; font-size: 13px; }
th, td { padding: 7px 8px; border-bottom: 1px solid var(--border); text-align: right; white-space: nowrap; }
th:first-child, td:first-child { text-align: left; }
th { color: var(--text-secondary); font-weight: 600; }
.scroll { overflow-x: auto; }
#rt { background: var(--sea); }
#map3d { position: absolute; inset: 0; }
.rt-panel { position: absolute; top: 30px; left: 104px; width: min(340px, calc(100% - 130px)); z-index: 3; }
.rt-panel select { border-radius: 14px; background: var(--lg-sel); border: 0; box-shadow: inset 0 1px 0 var(--lg-hi); padding: 7px 10px; }
.rt-legend { display: flex; align-items: center; gap: 8px; font-size: 11.5px; color: var(--text-secondary); }
.rt-legend i { width: 64px; height: 8px; border-radius: 4px; display: block; }
.rt-actions { display: flex; gap: 8px; flex-wrap: wrap; }
.rt-progress { font-variant-numeric: tabular-nums; min-height: 1.4em; }
.maplibregl-ctrl-group { border-radius: 18px !important; overflow: hidden; background: var(--glass) !important; backdrop-filter: var(--lg-blur); box-shadow: var(--lg-drop) !important; }
.maplibregl-popup-content { border-radius: 14px; background: var(--glass); backdrop-filter: var(--lg-blur); -webkit-backdrop-filter: var(--lg-blur); color: var(--text-primary); box-shadow: var(--lg-drop); padding: 8px 12px; font-size: 12px; }
.maplibregl-popup-tip { display: none; }
.maplibregl-ctrl-attrib { border-radius: 10px 0 0 0; font-size: 10px; }
select { font: inherit; padding: 6px 8px; border-radius: 6px; border: 1px solid var(--border);
  background: var(--surface-1); color: var(--text-primary); max-width: 100%; }
.insights li { margin-bottom: 6px; }
footer { color: var(--text-muted); font-size: 12px; margin-top: 24px; }

@media (max-width: 900px) {
  .app { padding: 0; }
  .shell { border-radius: 0; }
  .rail { width: 52px; }
  .stage { overflow-y: auto; }
  #ov { position: relative; min-height: 100%; display: flex; flex-direction: column; }
  #usmap { position: relative; height: 300px; order: 2; }
  .hello { position: relative; top: auto; left: auto; width: auto; padding: 64px 16px 8px; order: 1; }
  .cards { position: relative; left: auto; right: auto; bottom: auto; grid-template-columns: 1fr; padding: 16px; order: 3; }
  .topbar { right: 12px; top: 12px; }
  .scrollview { padding: 20px 16px 40px; }
}
@media (prefers-reduced-motion: no-preference) {
  .glow { animation: pulse 3.2s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
  @keyframes pulse { 50% { opacity: .55; transform: scale(1.18); } }
}

/* ---------- Liquid Glass (after Apple's iOS 26 / macOS Tahoe material) ---------- */
:root {
  --lg-tint: rgba(255, 255, 255, .22); --lg-tint-2: rgba(255, 255, 255, .06);
  --lg-edge: rgba(255, 255, 255, .95); --lg-edge-2: rgba(255, 255, 255, .25);
  --lg-hi: rgba(255, 255, 255, .9); --lg-lo: rgba(255, 255, 255, .35);
  --lg-drop: 0 12px 32px rgba(30, 50, 80, .16), 0 2px 6px rgba(30, 50, 80, .08);
  --lg-blur: blur(22px) saturate(185%) brightness(1.06);
  --lg-sel: rgba(255, 255, 255, .6);
}
:root[data-theme="dark"] {
  --lg-tint: rgba(255, 255, 255, .07); --lg-tint-2: rgba(255, 255, 255, .02);
  --lg-edge: rgba(255, 255, 255, .38); --lg-edge-2: rgba(255, 255, 255, .06);
  --lg-hi: rgba(255, 255, 255, .28); --lg-lo: rgba(255, 255, 255, .06);
  --lg-drop: 0 14px 36px rgba(0, 0, 0, .5), 0 2px 6px rgba(0, 0, 0, .3);
  --lg-blur: blur(22px) saturate(160%) brightness(.9);
  --lg-sel: rgba(255, 255, 255, .14);
}
.lg, .gcard, .chip, .maptip, .rail {
  position: relative; isolation: isolate;
  background: linear-gradient(160deg, var(--lg-tint), var(--lg-tint-2));
  backdrop-filter: var(--lg-blur); -webkit-backdrop-filter: var(--lg-blur);
  border: 0;
  box-shadow: var(--lg-drop), inset 0 1px 0 var(--lg-hi), inset 0 -1px 1px var(--lg-lo), inset 0 0 18px rgba(255, 255, 255, .08);
}
@supports (backdrop-filter: url(#lg-refract)) {
  .gcard, .rail { backdrop-filter: url(#lg-refract) var(--lg-blur); }
}
/* Specular rim: a gradient hairline that is brightest at the top-left, like light catching a glass edge. */
.gcard::before, .chip::before, .maptip::before, .rail::before {
  content: ""; position: absolute; inset: 0; border-radius: inherit; padding: 1px; pointer-events: none; z-index: 1;
  background: linear-gradient(135deg, var(--lg-edge) 0%, var(--lg-edge-2) 35%, transparent 55%, var(--lg-edge-2) 80%, var(--lg-edge) 100%);
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor;
  mask: linear-gradient(#000 0 0) content-box exclude, linear-gradient(#000 0 0);
}
/* Soft sheen across the upper half. */
.gcard::after, .rail::after {
  content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none; z-index: 0;
  background: radial-gradient(120% 60% at 20% 0%, rgba(255, 255, 255, .28), transparent 60%);
}
:root[data-theme="dark"] .gcard::after, :root[data-theme="dark"] .rail::after { background: radial-gradient(120% 60% at 20% 0%, rgba(255, 255, 255, .07), transparent 60%); }
.gcard > *, .rail > * { position: relative; z-index: 2; }

.app { padding: 14px; }
.shell { position: relative; border-radius: 30px; }
.rail { position: absolute; left: 16px; top: 16px; bottom: 16px; z-index: 6; width: 58px; border-radius: 29px; padding: 14px 0; gap: 6px; }
.logo { margin-bottom: 14px; }
.rail button { width: 42px; height: 42px; border-radius: 21px; transition: background .25s, transform .25s; }
.rail button:hover { background: var(--lg-sel); }
.rail button[aria-current="page"] { background: var(--lg-sel); color: var(--text-primary);
  box-shadow: inset 0 1px 0 var(--lg-hi), 0 4px 12px rgba(0, 0, 0, .08); }
.rail button:active { transform: scale(.92); }
.stage { margin-left: 0; }
.hello { left: 104px; top: 30px; }
.cards { left: 100px; right: 30px; bottom: 26px; gap: 18px; }
.scrollview { padding-left: 104px; }
.topbar { top: 16px; right: 16px; gap: 8px; }

.gcard { border-radius: 28px; padding: 16px 18px 18px; }
.chip { height: 34px; border-radius: 17px; padding: 0 14px; }
.chip.lang { padding: 3px; gap: 2px; }
.chip.lang button { border-radius: 14px; padding: 0 11px; position: relative; z-index: 2; transition: background .25s, color .25s; }
.chip.lang button[aria-pressed="true"] { background: var(--lg-sel); color: var(--text-primary);
  box-shadow: inset 0 1px 0 var(--lg-hi), 0 3px 10px rgba(0, 0, 0, .1); }
.chip > * { position: relative; z-index: 2; }
.chip:active { transform: scale(.97); }
.maptip { border-radius: 16px; padding: 9px 12px; }
.city-row { border-radius: 12px; }
.city-row:hover, .city-row[aria-pressed="true"] { background: var(--lg-sel); box-shadow: inset 0 1px 0 var(--lg-hi); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
.tile { border-radius: 20px; box-shadow: inset 0 1px 0 rgba(255, 255, 255, .55), inset 0 -2px 6px rgba(0, 0, 0, .06), 0 8px 18px rgba(0, 0, 0, .12); }
.tile.t1 { background: linear-gradient(160deg, #6fb1ff, #2f86f0); }
.tile.t2 { background: linear-gradient(160deg, #6ff0b0, #22cf78); }
.tile.t3 { background: linear-gradient(160deg, rgba(255, 255, 255, .9), rgba(255, 255, 255, .55)); color: #101114; }
.card { border-radius: 22px; }


@media (max-width: 900px) {
  .app { padding: 0; }
  .shell { border-radius: 0; }
  .rail { top: auto; bottom: max(14px, env(safe-area-inset-bottom)); left: 50%; transform: translateX(-50%); width: auto; height: 60px;
    flex-direction: row; padding: 0 10px; border-radius: 30px; position: fixed; }
  .rail .logo, .rail .spacer { display: none; }
  .hello { left: auto; padding-top: 64px; }
  .cards { left: auto; right: auto; padding-bottom: 96px; }
  .scrollview { padding: 20px 16px 110px; }
  .rt-panel { left: 12px; right: 12px; top: 58px; width: auto; }
}
@media (prefers-reduced-motion: reduce) { .rail button, .chip.lang button { transition: none; } }
</style>

<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <filter id="lg-refract" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.008 0.012" numOctaves="2" seed="7" result="n"/>
    <feGaussianBlur in="n" stdDeviation="2" result="nb"/>
    <feDisplacementMap in="SourceGraphic" in2="nb" scale="18" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
</svg>
<div class="app">
<div class="shell">
  <nav class="rail" aria-label="Views">
    <svg class="logo" viewBox="0 0 32 32" aria-hidden="true"><path d="M16 2 4 9v14l12 7 12-7V9z" fill="#2a78d6" stroke="none"/><path d="M4 9l12 7 12-7M16 16v14" stroke="#fff" stroke-width="1.6" fill="none"/></svg>
    <button type="button" data-view="ov" aria-current="page" data-i18n-aria="navOverview"><svg viewBox="0 0 24 24"><path d="M4 15a8 8 0 1 1 16 0"/><path d="M12 15l4-4"/></svg></button>
    <button type="button" data-view="an" data-i18n-aria="navAnalysis"><svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg></button>
    <button type="button" data-view="rt" data-i18n-aria="navRoutes"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></svg></button>
    <div class="spacer"></div>
  </nav>

  <div class="stage">
    <div class="topbar">
      <div class="chip lang theme" role="group" data-i18n-aria="toggleTheme">
        <button type="button" data-theme-set="light" aria-pressed="true"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg><span data-i18n="light"></span></button>
        <button type="button" data-theme-set="dark" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg><span data-i18n="dark"></span></button>
      </div>
      <div class="chip lang" role="group" aria-label="Language / Bahasa">
        <button type="button" data-lang="en" aria-pressed="true">EN</button>
        <button type="button" data-lang="id" aria-pressed="false">ID</button>
      </div>
      <button type="button" class="chip" id="dlBtn"><span data-i18n="download"></span><svg viewBox="0 0 24 24"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg></button>
    </div>

    <!-- Overview -->
    <section class="view" id="ov">
      <svg id="usmap" role="img" data-i18n-aria="mapAria"></svg>
      <div class="maptip" id="maptip" hidden></div>

      <div class="hello">
        <h1 data-i18n="hello"></h1>
        <p class="sub" id="ovSub"></p>
        <div class="tabs"><span class="on"><span data-i18n="tabCities"></span> <span id="nCities"></span></span><span class="off"><span data-i18n="tabStations"></span> <span id="nStations"></span></span></div>
        <div id="cityList"></div>
        <div class="legend-mini" id="dotLegend"></div>

let T, fmt, pct, lang = "en", view = "ov", focusCity = null, charts = [], routeIdx = 0;
let STATES = null, STATIONS = null;
const byCity = Object.fromEntries(D.by_city.map(c => [c.city, c]));

/* ---------- Overview ---------- */
function scopeStats() {
  const cities = focusCity ? [focusCity] : D.by_city.map(c => c.city);
  const s = { routes: 0, high: 0, med: 0, low: 0, stops: 0, pkgs: 0, stations: 0 };
  cities.forEach(c => {
    const b = byCity[c], m = D.score_by_city[c];
    s.routes += b.routes; s.high += b.routes * (m.High || 0); s.med += b.routes * (m.Medium || 0); s.low += b.routes * (m.Low || 0);
    s.stops += b.routes * b.stops; s.pkgs += b.routes * b.packages; s.stations += b.stations;
  });
  return s;
}

function drawCityList() {
  const groups = {};
  D.by_city.forEach(c => (groups[T.region[c.city]] ||= []).push(c));
  const el = document.getElementById("cityList");
  el.innerHTML = Object.entries(groups).map(([g, cs]) => `<div class="group-label">${g}</div>` + cs.map(c => {
    const m = D.score_by_city[c.city];
    const bars = SCORES.map(s => `<i style="width:${(m[s] || 0) * 100}%;background:var(--${s === "High" ? "good" : s === "Medium" ? "warn" : "bad"})"></i>`).join("");
    return `<button type="button" class="city-row" data-city="${c.city}" aria-pressed="${focusCity === c.city}"><span>${c.city}</span><span class="bar">${bars}</span><span class="v">${pct(c.high_pct, 0)}</span></button>`;
  }).join("")).join("");
  el.querySelectorAll(".city-row").forEach(b => b.onclick = () => { focusCity = focusCity === b.dataset.city ? null : b.dataset.city; renderOverview(); });
  document.getElementById("dotLegend").innerHTML = ["good", "warn", "bad"].map((k, i) => `<span><i style="background:var(--${k})"></i>${T.dotLegend[i]}</span>`).join("");
}

function project(W, H) {
  const kx = Math.cos(38 * Math.PI / 180);
  const pts = STATES.flatMap(s => s.geometry.coordinates.flat(2));
  const xs = [Math.min(...pts.map(p => p[0])) * kx, Math.max(...pts.map(p => p[0])) * kx];
  const ys = [Math.min(...pts.map(p => p[1])), Math.max(...pts.map(p => p[1]))];
  // Leave room for the floating panels: map sits in the right/upper part on wide screens.
  const wide = W > 900;
  const box = wide ? { x0: W * 0.30, x1: W - 30, y0: 40, y1: H - 210 } : { x0: 12, x1: W - 12, y0: 12, y1: H - 12 };
  const k = Math.min((box.x1 - box.x0) / (xs[1] - xs[0]), (box.y1 - box.y0) / (ys[1] - ys[0]));
  const ox = box.x0 + ((box.x1 - box.x0) - k * (xs[1] - xs[0])) / 2, oy = box.y0 + ((box.y1 - box.y0) - k * (ys[1] - ys[0])) / 2;
  return ([lng, lat]) => [ox + (lng * kx - xs[0]) * k, oy + (ys[1] - lat) * k];
}

function drawMap() {
  if (!STATES || !STATIONS) return;
  const svg = document.getElementById("usmap");
  const W = svg.clientWidth, H = svg.clientHeight;
  if (!W || !H) return;
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
  const P = project(W, H);
  const path = g => g.coordinates.map(poly => poly.map(r => "M" + r.map(p => P(p).map(v => v.toFixed(1)).join(",")).join("L") + "Z").join("")).join("");
  let out = `<defs>${["good", "warn", "bad"].map(k => `<radialGradient id="g-${k}"><stop offset="0" stop-color="${css("--" + k)}" stop-opacity=".55"/><stop offset="1" stop-color="${css("--" + k)}" stop-opacity="0"/></radialGradient>`).join("")}</defs>`;
  out += STATES.map(s => `<path class="state" d="${path(s.geometry)}" fill-rule="evenodd"/>`).join("");
  const maxR = d3max(STATIONS.map(s => s.routes));
  // Spread stations of one metro apart a little so overlapping dots stay readable.
  STATIONS.forEach(s => {
    const [x, y] = P([s.lng, s.lat]);
    const r = 5 + 5 * Math.sqrt(s.routes / maxR), k = status(s.high_pct);
    const dim = focusCity && s.city !== focusCity ? " dim" : "";
    out += `<circle class="glow${dim}" cx="${x}" cy="${y}" r="${r * 4}" fill="url(#g-${k})"/>`;
    out += `<circle class="dot${dim}" data-st="${s.station_code}" cx="${x}" cy="${y}" r="${r}" fill="${css("--" + k)}"/>`;
  });
  svg.innerHTML = out;
  const tip = document.getElementById("maptip");
  svg.querySelectorAll(".dot").forEach(c => {
    const s = STATIONS.find(q => q.station_code === c.dataset.st);
    c.onmousemove = e => {
      const r = svg.getBoundingClientRect();
      tip.innerHTML = `<b>${s.station_code} · ${s.city}</b><span>${fmt(s.routes)} ${T.tipRoutes} · ${pct(s.high_pct)} ${T.tipHigh}</span>`;
      tip.hidden = false;
      tip.style.left = Math.min(r.width - tip.offsetWidth - 8, e.clientX - r.left + 14) + "px";
      tip.style.top = Math.max(8, e.clientY - r.top - tip.offsetHeight - 10) + "px";
    };
    c.onmouseleave = () => { tip.hidden = true; };
    c.onclick = () => { focusCity = focusCity === s.city ? null : s.city; renderOverview(); };
  });
}
const d3max = a => a.reduce((m, v) => Math.max(m, v), -Infinity);

function drawCards() {
  const s = scopeStats(), tag = focusCity || T.all;
  ["scopeTag1", "scopeTag2", "scopeTag3"].forEach(id => document.getElementById(id).textContent = tag);

  const vals = [["High", s.high, "good"], ["Medium", s.med, "warn"], ["Low", s.low, "bad"]];
  const max = d3max(vals.map(v => v[1]));
  document.getElementById("pillars").innerHTML = vals.map(([k, v, c]) => {
    const h = Math.max(4, 76 * v / max);
    const hatch = `repeating-linear-gradient(135deg, var(--${c}) 0 2px, transparent 2px 4px)`;
    return `<div class="pillar"><div class="pair"><i style="height:${h}px;background:var(--${c})"></i><i class="hatch" style="height:${h}px;background:${hatch}"></i></div><b>${fmt(Math.round(v))}</b><span>${T.score[k]}</span></div>`;
  }).join("");

  const share = s.high / s.routes, R = 42, C = 2 * Math.PI * R;
  document.getElementById("ring").innerHTML = `<svg viewBox="0 0 104 104"><circle cx="52" cy="52" r="${R}" fill="none" stroke="${css("--grid")}" stroke-width="7"/>
    <circle cx="52" cy="52" r="${R}" fill="none" stroke="${css("--good")}" stroke-width="7" stroke-linecap="round" stroke-dasharray="${C * share} ${C}" transform="rotate(-90 52 52)"/>
    <text x="52" y="50" text-anchor="middle" font-size="16" font-weight="650" fill="currentColor">${pct(share, 0)}</text>
    <text x="52" y="66" text-anchor="middle" font-size="11" fill="currentColor">${T.high}</text></svg>`;
  document.getElementById("ringNote").textContent = T.ringNote(Math.round(s.high), fmt);

  const tiles = [["t1", '<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/>', T.tStations, fmt(s.stations)],
    ["t2", '<path d="M12 21s-7-6.2-7-11a7 7 0 0 1 14 0c0 4.8-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/>', T.tStops, fmt(s.stops / 1000, 0)],
    ["t3", '<path d="M3 7l9-4 9 4-9 4-9-4zM3 7v10l9 4 9-4V7M12 11v10"/>', T.tPkgs, fmt(s.pkgs / 1000, 0)]];
  document.getElementById("tiles").innerHTML = tiles.map(([c, ic, l, v]) => `<div class="tile ${c}"><svg viewBox="0 0 24 24">${ic}</svg><small>${l}</small><b>${v}</b></div>`).join("");
  document.getElementById("volNote").textContent = T.volNote(Math.round(s.stops / s.routes), fmt);
}

function renderOverview() {
  document.getElementById("ovSub").textContent = T.ovSub(D.kpi, fmt);
  document.getElementById("nCities").textContent = D.by_city.length;
  document.getElementById("nStations").textContent = STATIONS ? STATIONS.length : D.kpi.stations;
  drawCityList(); drawMap(); drawCards();
}

/* ---------- Analysis ---------- */
function renderAnalysis() {
  const sc = s => T.score[s];
  document.getElementById("subtitle").textContent = T.subtitle(D.kpi, fmt);
  const kv = [fmt(D.kpi.routes), fmt(D.kpi.stops), fmt(D.kpi.packages), fmt(D.kpi.stations), pct(D.kpi.high_pct), pct(D.kpi.failed_pct, 2)];
  document.getElementById("kpis").innerHTML = kv.map((v, i) => `<div class="card kpi"><div class="v">${v}</div><div class="l">${T.kpi[i]}</div></div>`).join("");
  document.querySelectorAll("[data-legend]").forEach(el => el.innerHTML = SCORES.map(s => `<span><i style="background:${color(s)}"></i>${sc(s)}</span>`).join(""));

  charts.forEach(c => c.destroy()); charts = [];
  Chart.defaults.color = css("--text-secondary"); Chart.defaults.borderColor = css("--grid");
  const cities = D.by_city.map(c => c.city);
  charts.push(new Chart(cityScore, { type: "bar",
    data: { labels: cities, datasets: SCORES.map(s => ({ label: sc(s), data: cities.map(c => (D.score_by_city[c][s] || 0) * 100),
      backgroundColor: color(s), borderColor: css("--surface-1"), borderWidth: { right: 2 }, borderRadius: 4, borderSkipped: false, barThickness: 22 })) },
    options: { indexAxis: "y", scales: { x: { stacked: true, max: 100, ticks: { callback: v => v + "%" } }, y: { stacked: true, grid: { display: false } } },
      plugins: { tooltip: { callbacks: { label: c => `${c.dataset.label}: ${fmt(c.raw, 1)}%` } } } } }));
  charts.push(new Chart(daily, { type: "line",
    data: { labels: Object.keys(D.routes_by_date), datasets: [{ label: T.routes, data: Object.values(D.routes_by_date), borderColor: color("High"), borderWidth: 2, pointRadius: 0, pointHoverRadius: 5, tension: 0.2 }] },
    options: { scales: { x: { ticks: { maxTicksLimit: 6 }, grid: { display: false } }, y: { beginAtZero: true } } } }));
  const hist = (canvas, h, digits, asPct) => charts.push(new Chart(canvas, { type: "line",
    data: { labels: h.edges.slice(0, -1).map(e => asPct ? fmt(e * 100, 0) + "%" : fmt(e, digits)),
      datasets: SCORES.map(s => ({ label: sc(s), data: (h.series[s] || []).map(v => v * 100), borderColor: color(s), borderWidth: 2, pointRadius: 0, pointHoverRadius: 5, tension: 0.3 })) },
    options: { scales: { y: { title: { display: true, text: T.pctRoutes }, beginAtZero: true }, x: { grid: { display: false }, ticks: { maxTicksLimit: 8 } } },
      plugins: { tooltip: { callbacks: { label: c => `${c.dataset.label}: ${fmt(c.raw, 1)}% ${T.ofRoutes}` } } } } }));
  hist(histZone, D.hist.zones_revisited_pct, 2, true);
  hist(histPath, D.hist.path_vs_nn, 2, false);

  document.getElementById("modelNote").textContent = T.modelNote(D.model, pct);
  const imp = D.model.importance;
  charts.push(new Chart(importance, { type: "bar",
    data: { labels: imp.map(i => T.labels[i.feature] || i.feature), datasets: [{ label: T.importance, data: imp.map(i => i.value), backgroundColor: color("High"), borderRadius: 4, barThickness: 14 }] },
    options: { indexAxis: "y", scales: { y: { grid: { display: false } } }, plugins: { tooltip: { callbacks: { label: c => `${T.importance}: ${fmt(c.raw, 3)}` } } } } }));

  const cols = [["city"], ["routes", 0], ["stations", 0], ["stops", 0], ["packages", 0], ["path_km", 1], ["service_h", 1], ["high_pct"]];
  cityTable.innerHTML = "<tr>" + T.cityCols.map(c => `<th>${c}</th>`).join("") + "</tr>" +
    D.by_city.map(r => "<tr>" + cols.map(([k, d]) => `<td>${k === "city" ? r[k] : k === "high_pct" ? pct(r[k]) : fmt(r[k], d)}</td>`).join("") + "</tr>").join("");
  const feats = ["n_stops", "n_packages", "path_km", "path_vs_nn", "n_zones", "zones_revisited_pct", "zone_switches_per_zone", "tw_pct", "failed_pct"];
  scoreTable.innerHTML = `<tr><th>${T.metric}</th>` + SCORES.map(s => `<th>${sc(s)}</th>`).join("") + "</tr>" +
    feats.map(f => `<tr><td>${T.labels[f]}</td>` + SCORES.map(s => { const v = D.by_score[s][f]; return `<td>${f.endsWith("pct") ? pct(v, 2) : fmt(v, 2)}</td>`; }).join("") + "</tr>").join("");

  const bs = D.by_score, top = imp.slice(0, 3).map(i => T.labels[i.feature]);
  const best = [...D.by_city].sort((a, b) => b.high_pct - a.high_pct)[0];
  insights.innerHTML = T.insights(bs, fmt, pct, best, top, D.model.auc).map(t => `<li>${t}</li>`).join("");
}

/* ---------- Routes (3D) ---------- */
const STYLE = { light: "https://tiles.openfreemap.org/styles/positron", dark: "https://tiles.openfreemap.org/styles/dark" };
let map = null, styleKey = null, pitch = 60, play = null;
const hex = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
const mix = (a, b, k) => "#" + hex(a).map((v, i) => Math.round(v + (hex(b)[i] - v) * k).toString(16).padStart(2, "0")).join("");
const rampFor = sc => { const c = color(sc), lo = mix(c, "#ffffff", 0.75), hi = mix(c, "#000000", 0.45); return k => k < .5 ? mix(lo, c, k * 2) : mix(c, hi, (k - .5) * 2); };
const isDark = () => document.documentElement.dataset.theme === "dark";
// Fill-extrusions can only rise straight up, so an inverted prism is built from stacked triangular
// slices that widen with height: the tip points at the stop and the whole marker floats above the map.
const PRISM = { slices: 8, float: 35, tall: 55, half: 15 };
function triangle([lat, lng], m) {
  const kLat = 1 / 111320, kLng = 1 / (111320 * Math.cos(lat * Math.PI / 180));
  const ring = [-90, 30, 150].map(a => [lng + Math.cos(a * Math.PI / 180) * m * kLng, lat - Math.sin(a * Math.PI / 180) * m * kLat]);
  return [[...ring, ring[0]]];
}
function routeGeo(r) {
  const ramp = rampFor(r.score), n = r.points.length - 1;
  const stops = [], shadows = [];
  r.points.forEach((p, k) => {
    const station = k === 0, s = station ? 2.4 : 1;
    const props = { seq: k, label: station ? T.station : `${T.stop} #${k}`, zone: r.zones[k] || "",
      color: station ? (isDark() ? "#f0f1f3" : "#101114") : ramp((k - 1) / Math.max(1, n - 1)) };
    const base = PRISM.float * s, tall = PRISM.tall * s, step = tall / PRISM.slices;
    for (let i = 0; i < PRISM.slices; i++) {
      stops.push({ type: "Feature", properties: { ...props, b: base + i * step, h: base + (i + 1) * step },
        geometry: { type: "Polygon", coordinates: triangle(p, PRISM.half * s * (i + 1) / PRISM.slices) } });
    }
    shadows.push({ type: "Feature", properties: { seq: k, r: s }, geometry: { type: "Point", coordinates: [p[1], p[0]] } });
  });
  const line = { type: "Feature", properties: {}, geometry: { type: "LineString", coordinates: r.points.slice(1).map(p => [p[1], p[0]]) } };
  return { stops: { type: "FeatureCollection", features: stops }, shadows: { type: "FeatureCollection", features: shadows },
    line: { type: "FeatureCollection", features: [line] } };
}
function addLayers() {
  const r = D.sample_routes[routeIdx], g = routeGeo(r);
  if (map.getSource("openmaptiles") && !map.getLayer("bld3d")) {
    map.addLayer({ id: "bld3d", type: "fill-extrusion", source: "openmaptiles", "source-layer": "building", minzoom: 12,
      paint: { "fill-extrusion-color": isDark() ? "#3a4757" : "#dfe6ee",
        "fill-extrusion-height": ["coalesce", ["get", "render_height"], 8], "fill-extrusion-base": ["coalesce", ["get", "render_min_height"], 0],
        "fill-extrusion-opacity": 0.55 } });
  }
  map.addSource("route", { type: "geojson", data: g.line });
  map.addSource("stops", { type: "geojson", data: g.stops });
  map.addSource("driver", { type: "geojson", data: { type: "FeatureCollection", features: [] } });
  map.addLayer({ id: "route-glow", type: "line", source: "route", layout: { "line-join": "round", "line-cap": "round" },
    paint: { "line-color": color(r.score), "line-width": 10, "line-opacity": 0.18, "line-blur": 4 } });
  map.addLayer({ id: "route-line", type: "line", source: "route", layout: { "line-join": "round", "line-cap": "round" },
    paint: { "line-color": color(r.score), "line-width": 2.5, "line-opacity": 0.9 } });
  map.addSource("shadows", { type: "geojson", data: g.shadows });
  map.addLayer({ id: "shadows", type: "circle", source: "shadows",
    paint: { "circle-color": "#000000", "circle-opacity": isDark() ? 0.35 : 0.16, "circle-blur": 0.9, "circle-pitch-alignment": "map",
      "circle-radius": ["*", ["get", "r"], ["interpolate", ["exponential", 2], ["zoom"], 11, 2, 14, 7, 17, 40]] } });
  map.addLayer({ id: "pillars", type: "fill-extrusion", source: "stops",
    paint: { "fill-extrusion-color": ["get", "color"], "fill-extrusion-height": ["get", "h"], "fill-extrusion-base": ["get", "b"],
      "fill-extrusion-opacity": 0.95, "fill-extrusion-vertical-gradient": true } });
  map.addLayer({ id: "driver", type: "circle", source: "driver",
    paint: { "circle-radius": 9, "circle-color": color(r.score), "circle-stroke-color": "#ffffff", "circle-stroke-width": 3, "circle-pitch-alignment": "map" } });
}
function fit(animate) {
  const pts = D.sample_routes[routeIdx].points.slice(1);
  const lats = pts.map(p => p[0]), lngs = pts.map(p => p[1]);
  const pad = innerWidth > 900 ? { top: 60, bottom: 60, left: 480, right: 60 } : { top: 40, bottom: 120, left: 20, right: 20 };
  map.fitBounds([[Math.min(...lngs), Math.min(...lats)], [Math.max(...lngs), Math.max(...lats)]],
    { padding: pad, pitch, bearing: pitch ? -24 : 0, duration: animate ? 1600 : 0 });
}
function ensureMap() {
  const key = isDark() ? "dark" : "light";
  if (!map) {
    map = new maplibregl.Map({ container: "map3d", style: STYLE[key], pitch, bearing: -24, center: [-71.1, 42.33], zoom: 12, maxPitch: 75, attributionControl: { compact: true } });
    map.addControl(new maplibregl.NavigationControl({ visualizePitch: true }), "bottom-right");
    styleKey = key;
    map.on("style.load", () => { addLayers(); fit(false); });
    const pop = new maplibregl.Popup({ closeButton: false, closeOnClick: false, offset: 12 });
    map.on("mousemove", "pillars", e => {
      map.getCanvas().style.cursor = "pointer";
      const f = e.features[0].properties;
      pop.setLngLat(e.lngLat).setHTML(`<b>${f.label}</b>${f.zone ? `<br>${T.zone} ${f.zone}` : ""}`).addTo(map);
    });
    map.on("mouseleave", "pillars", () => { map.getCanvas().style.cursor = ""; pop.remove(); });
  } else if (key !== styleKey) {
    styleKey = key;
    stopPlay();
    map.setStyle(STYLE[key]);
  }
}
function updateRoute(animate) {
  stopPlay();
  const r = D.sample_routes[routeIdx];
  routeInfo.textContent = T.routeInfo(r, T.score[r.score], pct);
  const ramp = rampFor(r.score);
  rampSwatch.style.background = `linear-gradient(90deg, ${ramp(0)}, ${ramp(.5)}, ${ramp(1)})`;
  if (!map || !map.getSource("stops")) return;
  const g = routeGeo(r);
  map.getSource("stops").setData(g.stops);
  map.getSource("shadows").setData(g.shadows);
  map.getSource("route").setData(g.line);
  ["route-glow", "route-line"].forEach(id => map.setPaintProperty(id, "line-color", color(r.score)));
  map.setPaintProperty("driver", "circle-color", color(r.score));
  fit(animate);
}
function renderRoutes() {
  routePick.innerHTML = D.sample_routes.map((r, i) => `<option value="${i}">${T.score[r.score]} · ${r.n_stops} ${T.stops} · ${r.route_id.slice(0, 18)}…</option>`).join("");
  routePick.value = routeIdx;
  playLabel.textContent = play ? T.pause : T.play;
  if (view === "rt") drawRoute(routeIdx);
}
function drawRoute(i) {
  routeIdx = i;
  ensureMap();
  map.resize();
  updateRoute(true);
}
routePick.onchange = e => drawRoute(+e.target.value);
document.querySelectorAll("[data-pitch]").forEach(b => b.onclick = () => {
  pitch = +b.dataset.pitch;
  document.querySelectorAll("[data-pitch]").forEach(q => q.setAttribute("aria-pressed", String(q === b)));
  if (map) map.easeTo({ pitch, bearing: pitch ? -24 : 0, duration: 900 });
});

// Playback: the driver dot walks the sequence and pillars appear as each stop is reached.
function stopPlay() {
  if (play) cancelAnimationFrame(play.raf);
  play = null;
  if (T) playLabel.textContent = T.play;
  playProgress.textContent = "";
  if (map && map.getLayer("pillars")) {
    map.setFilter("pillars", null);
    map.setFilter("shadows", null);
    map.getSource("driver").setData({ type: "FeatureCollection", features: [] });
  }
}
playBtn.onclick = () => {
  if (play) return stopPlay();
  if (!map || !map.getSource("stops")) return;
  const pts = D.sample_routes[routeIdx].points, n = pts.length - 1;
  const speed = matchMedia("(prefers-reduced-motion: reduce)").matches ? n : n / 18000; // whole route in ~18 s
  play = { t0: performance.now() };
  playLabel.textContent = T.pause;
  const step = now => {
    if (!play) return;
    const pos = Math.min(n, 1 + (now - play.t0) * speed);
    const k = Math.floor(pos), f = pos - k, a = pts[k], b = pts[Math.min(n, k + 1)];
    map.getSource("driver").setData({ type: "Feature", properties: {}, geometry: { type: "Point", coordinates: [a[1] + (b[1] - a[1]) * f, a[0] + (b[0] - a[0]) * f] } });
    map.setFilter("pillars", ["<=", ["get", "seq"], k]);
    map.setFilter("shadows", ["<=", ["get", "seq"], k]);
    playProgress.textContent = T.playing(fmt(k), fmt(n));
    if (pos < n) play.raf = requestAnimationFrame(step);
    else { play = null; playLabel.textContent = T.play; }
  };
  play.raf = requestAnimationFrame(step);
};

/* ---------- Shell ---------- */
function show(v) {
  view = v;
  document.querySelectorAll(".view").forEach(s => s.hidden = s.id !== v);
  document.querySelectorAll(".rail [data-view]").forEach(b => b.dataset.view === v ? b.setAttribute("aria-current", "page") : b.removeAttribute("aria-current"));
  if (v === "an") renderAnalysis();
  if (v === "rt") drawRoute(routeIdx);
  if (v === "ov") drawMap();
  if (location.hash.slice(1) !== v) history.replaceState(null, "", location.pathname + location.search + "#" + v);
}
document.querySelectorAll(".rail [data-view]").forEach(b => b.onclick = () => show(b.dataset.view));
document.querySelectorAll("[data-goto]").forEach(a => a.onclick = () => show(a.dataset.goto));

function render() {
  T = I18N[lang];
  fmt = (n, d = 0) => Number(n).toLocaleString(T.locale, { maximumFractionDigits: d, minimumFractionDigits: d });
  pct = (n, d = 1) => fmt(n * 100, d) + "%";
  document.documentElement.lang = lang;
  document.title = T.pageTitle;
  document.querySelectorAll("[data-i18n]").forEach(el => { el.textContent = T[el.dataset.i18n]; });
  document.querySelectorAll("[data-i18n-aria]").forEach(el => el.setAttribute("aria-label", T[el.dataset.i18nAria]));
  document.querySelectorAll(".chip.lang button[data-lang]").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.lang === lang)));
  document.querySelectorAll("[data-theme-set]").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.themeSet === document.documentElement.dataset.theme)));
  renderOverview(); renderRoutes();
  if (view === "an") renderAnalysis();
}
function setLang(l) {
  lang = I18N[l] ? l : "en";
  try { localStorage.setItem("lm-lang", lang); } catch (e) {}
  const u = new URL(location.href); u.searchParams.set("lang", lang); history.replaceState(null, "", u);
  render();
}
document.querySelectorAll(".chip.lang button[data-lang]").forEach(b => b.onclick = () => setLang(b.dataset.lang));

function setTheme(th) {
  document.documentElement.dataset.theme = th;
  try { localStorage.setItem("lm-theme", th); } catch (e) {}
  if (T) render();
}
document.querySelectorAll("[data-theme-set]").forEach(b => b.onclick = () => setTheme(b.dataset.themeSet));

document.getElementById("dlBtn").onclick = () => {
  const rows = (STATIONS || []).filter(s => !focusCity || s.city === focusCity);
  const csv = [T.csvCols.join(",")].concat(rows.map(s => [s.station_code, s.city, s.routes, s.high_pct].join(","))).join("\n");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([csv], { type: "text/csv" }));
  a.download = `stations${focusCity ? "-" + focusCity.toLowerCase().replace(/\s+/g, "-") : ""}.csv`;
  a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
};

addEventListener("resize", () => { if (view === "ov") drawMap(); });

Chart.defaults.font.family = getComputedStyle(document.body).fontFamily;
Chart.defaults.plugins.legend.display = false;
Chart.defaults.maintainAspectRatio = false;
Chart.defaults.plugins.tooltip.mode = "index";
Chart.defaults.plugins.tooltip.intersect = false;

let th0 = "light";
try { th0 = localStorage.getItem("lm-theme") || "light"; } catch (e) {}
document.documentElement.dataset.theme = th0;
let saved = null;
try { saved = localStorage.getItem("lm-lang"); } catch (e) {}
lang = new URLSearchParams(location.search).get("lang") || saved || "en";
if (!I18N[lang]) lang = "en";
render();
show(["ov", "an", "rt"].includes(location.hash.slice(1)) ? location.hash.slice(1) : "ov");

Promise.all([
  fetch("us_states.json").then(r => r.json()),
  fetch("stations.csv").then(r => r.text()),
]).then(([states, csv]) => {
  STATES = states;
  const [head, ...lines] = csv.trim().split(/\r?\n/);
  const cols = head.split(",");
  STATIONS = lines.map(l => Object.fromEntries(l.split(",").map((v, i) => [cols[i], isNaN(+v) ? v : +v])));
  renderOverview();
}).catch(() => {
  document.getElementById("ovSub").textContent = "Map data failed to load. Serve this folder over http (python -m http.server).";
});
</script>
</body>
